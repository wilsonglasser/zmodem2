[package]
authors = ["Jarkko Sakkinen <jarkko.sakkinen@iki.fi>"]
description = "ZMODEM file transfer protocol"
edition = "2021"
homepage = "https://codeberg.org/jarkko/zmodem2"
license = "MIT OR Apache-2.0"
name = "zmodem2"
repository = "https://codeberg.org/jarkko/zmodem2.git"
rust-version = "1.79"
version = "0.3.3"
build = "build.rs"

[features]
default = ["std"]
std = []

[dependencies]
bitflags = "2.4"
heapless = "0.8"
log = { version = "0.4", default-features = false }
strum = { version = "0.27", default-features=false, features = ["derive"] }
strum_macros = { version = "0.27", default-features=false }

[dev-dependencies]
rstest = "0.25"
log = "0.4"
tempfile = "3.10"

[[test]]
name = "protocol"
path = "tests/protocol.rs"
harness = true

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = true
